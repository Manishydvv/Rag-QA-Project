# ==================================================
# RAG Q&A System - CI/CD Pipeline (Gemini Edition)
# ==================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ... [Lint job stays the same] ...
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linting tools
        run: pip install ruff black
      - name: Run Ruff linter
        run: ruff check app/ tests/ --output-format=github
      - name: Check code formatting
        run: black --check app/ tests/

  # ============================================
  # Unit Tests (UPDATED FOR GOOGLE)
  # ============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        env:
          # CHANGE 1: Use GOOGLE_API_KEY instead of OPENAI_API_KEY
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }} 
          QDRANT_URL: "http://localhost:6333"
          QDRANT_API_KEY: "test-key"
        run: |
          pytest --cov=app --cov-report=xml --cov-report=html --cov-fail-under=60

  # ============================================
  # Build Docker Image (UPDATED FOR GOOGLE)
  # ============================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Test Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: rag-qa-system:${{ github.sha }}
          outputs: type=docker,dest=/tmp/myimage.tar
      
      - name: Load Docker image
        run: |
          docker load --input /tmp/myimage.tar
          docker image ls -a

      - name: Verify Container Startup
        run: |
          # CHANGE 2: Pass GOOGLE_API_KEY to the container test
          docker run --rm \
            -e GOOGLE_API_KEY="test-key-mock" \
            -e QDRANT_URL="http://localhost:6333" \
            -e QDRANT_API_KEY="test-key" \
            rag-qa-system:${{ github.sha }} python -c "from app.main import app; print('App loaded successfully')"